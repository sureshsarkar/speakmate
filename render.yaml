# Render Blueprint: API + Socket.IO backend only (the React app is deployed on Vercel).
# Render dashboard > New > Blueprint > pick this repo, or create a Web Service by hand with the same values.
services:
  - type: web
    name: speakmate-api
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: 1
      - key: SERVE_CLIENT
        value: false
      # Your Vercel URL, e.g. https://speakmate.vercel.app (comma separate more origins if needed)
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      # Optional: TURN_URLS, TURN_USERNAME, TURN_PASSWORD (or TURN_SECRET), SMTP_*, GOOGLE_CLIENT_ID,
      # CLOUDINARY_*, VAPID_* - see server/.env.example
