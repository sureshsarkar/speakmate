# coturn config for SpeakMate. Set TURN_URLS=turn:YOUR_DOMAIN:3478 and TURN_SECRET=<same secret as below> in server/.env
listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
static-auth-secret=CHANGE_ME_TO_A_LONG_RANDOM_SECRET
realm=turn.yourdomain.com
# Your server's public IP (required behind NAT / on cloud VMs)
# external-ip=203.0.113.10
min-port=49160
max-port=49200
total-quota=200
stale-nonce=600
# Security: never relay to private networks
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
# TLS (recommended for turns: and port 443 fallbacks)
# cert=/etc/letsencrypt/live/turn.yourdomain.com/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.yourdomain.com/privkey.pem
no-cli
log-file=stdout
