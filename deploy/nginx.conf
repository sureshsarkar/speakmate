# Example nginx site: static React build + API + Socket.IO on one domain (HTTPS is REQUIRED for microphone access)
server {
  listen 80;
  server_name speakmate.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name speakmate.example.com;

  ssl_certificate     /etc/letsencrypt/live/speakmate.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/speakmate.example.com/privkey.pem;

  # Never allow the camera; microphone only for this origin
  add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
  add_header X-Content-Type-Options nosniff always;

  root /var/www/speakmate/client/dist;
  index index.html;

  location /api/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }

  # Service worker must never be cached long-term
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  location / {
    try_files $uri /index.html;
  }
}
